<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TF2PL Web</title>
<style>
:root {
  --void:#021015; --deep:#04191f; --panel:rgba(4,28,34,.86); --panel2:rgba(8,44,52,.92); --panelhi:rgba(18,82,88,.55);
  --well:rgba(1,10,13,.88); --ink:#e4fffb; --muted:#8fc5c0; --dim:#4f8984; --teal:#3fe6d8; --tealhi:#b9fff7; --tealdeep:#0f6d73;
  --orange:#ff9a1f; --orangehi:#ffcf7a; --orangedeep:#c2560c; --magenta:#ff3fd8; --green:#8dff6a; --red:#ff4f6d; --blue:#5aa9ff;
  --line:rgba(111,247,234,.22); --linehot:rgba(111,247,234,.55);
  --font:"Bahnschrift","Segoe UI",system-ui,sans-serif; --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; overflow:hidden; }
body { display:flex; flex-direction:column; height:100vh; color:var(--ink); font:14px/1.38 var(--font);
  background:
    linear-gradient(rgba(63,230,216,.035) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, rgba(63,230,216,.035) 1px, transparent 1px) 0 0/28px 28px,
    radial-gradient(ellipse at 30% -10%, #0a3a42 0%, var(--void) 62%);
  background-color:var(--void); }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--teal); }
::selection { background:rgba(255,154,31,.35); }

/* ---------- themed scrollbars ---------- */
* { scrollbar-color:var(--tealdeep) rgba(1,10,13,.6); scrollbar-width:thin; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:rgba(1,10,13,.6); }
::-webkit-scrollbar-thumb { background:linear-gradient(var(--tealdeep), #0b545a); border:2px solid rgba(1,10,13,.6); border-radius:6px; }
::-webkit-scrollbar-thumb:hover { background:var(--teal); }
::-webkit-scrollbar-corner { background:transparent; }

/* ---------- header ---------- */
header { flex:none; height:62px; display:flex; align-items:center; gap:18px; padding:0 18px; position:relative;
  background:linear-gradient(180deg, rgba(4,25,31,.98), rgba(4,25,31,.9)); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; }
.brand .mark { width:32px; height:32px; }
.brand .word { font-weight:700; letter-spacing:.32em; font-size:17px; color:var(--ink); }
.brand .word b { color:var(--orange); font-weight:700; }
.screen { border-left:1px solid var(--line); padding-left:14px; line-height:1.1; }
.screen small { display:block; font-size:10px; letter-spacing:.3em; color:var(--muted); }
.screen span { font-size:18px; letter-spacing:.12em; font-weight:700; }
.screen span.preview { color:var(--orange); }
nav.menus { display:flex; gap:4px; }
nav.menus button { background:none; border:0; padding:8px 12px; letter-spacing:.2em; font-size:13px; color:var(--muted); cursor:pointer; }
nav.menus button:hover, nav.menus button.open { color:var(--ink); background:rgba(63,230,216,.08); }
.grow { flex:1; }
.status { font-size:11px; letter-spacing:.18em; padding:3px 9px; border:1px solid var(--line); color:var(--muted); text-transform:uppercase; }
.status.live { color:var(--green); border-color:rgba(141,255,106,.45); }
.status.poll { color:var(--orangehi); border-color:rgba(255,207,122,.45); }
.status.off { color:var(--red); border-color:rgba(255,79,109,.55); }

/* ---------- skewed buttons ---------- */
.btn { position:relative; z-index:0; display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:30px;
  padding:4px 16px; border:0; background:none; cursor:pointer; color:var(--ink); white-space:nowrap; letter-spacing:.06em; }
.btn::before { content:""; position:absolute; inset:0; z-index:-1; transform:skewX(-14deg); background:var(--panel2); border:1px solid var(--line); }
.btn:hover::before { border-color:var(--teal); background:rgba(18,82,88,.7); }
.btn.primary { color:#1a0b00; font-weight:700; }
.btn.primary::before { background:linear-gradient(180deg, var(--orangehi), var(--orange)); border-color:var(--orange); }
.btn.primary:hover::before { background:linear-gradient(180deg, #ffe3ad, var(--orangehi)); }
.btn.ghost::before { background:transparent; }
.btn.danger { color:var(--red); }
.btn.danger::before { border-color:rgba(255,79,109,.55); }
.btn.small { min-height:24px; padding:2px 11px; font-size:12px; }
.btn:disabled { opacity:.38; cursor:default; }
.btn:disabled:hover::before { border-color:var(--line); background:var(--panel2); }
.btn.primary:disabled:hover::before { background:linear-gradient(180deg, var(--orangehi), var(--orange)); }

/* ---------- banners, strip, chips ---------- */
.banner { flex:none; display:flex; align-items:center; gap:14px; margin:8px 18px 0 30px; padding:6px 12px; border:1px solid; }
.banner.preview { background:rgba(255,154,31,.13); border-color:rgba(255,154,31,.6); }
.banner.update { background:rgba(63,230,216,.08); border-color:var(--linehot); }
.banner.warn { background:rgba(255,79,109,.1); border-color:rgba(255,79,109,.6); }
.banner b { letter-spacing:.2em; font-size:12px; }
.banner.preview b { color:var(--orangehi); }
.strip { flex:none; display:flex; align-items:center; gap:22px; height:40px; padding:0 18px 0 30px; margin-top:6px;
  background:linear-gradient(90deg, rgba(255,154,31,.11), transparent 45%, transparent 55%, rgba(255,154,31,.11)); border-bottom:1px solid var(--line); }
.micro { font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--orange); display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.micro::before { content:""; width:3px; height:12px; background:currentColor; }
.micro.nobar::before { display:none; }
.where { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.where .map { color:var(--tealhi); }
.where .sep { color:var(--dim); margin:0 8px; }
.where .off { color:var(--orange); }
.counter { display:flex; align-items:baseline; gap:8px; white-space:nowrap; }
.counter small { font-size:10px; letter-spacing:.24em; color:var(--muted); text-transform:uppercase; }
.counter span { font:700 20px var(--mono); color:var(--tealhi); }
.counter.hot span { color:var(--orange); }
.parse { width:140px; }
.chips { flex:none; display:flex; gap:6px; padding:8px 18px 4px 30px; overflow-x:auto; }
.chip { border:1px solid var(--line); background:rgba(4,28,34,.7); padding:3px 12px; border-radius:2px; cursor:pointer; white-space:nowrap;
  font-size:12px; letter-spacing:.08em; color:var(--muted); display:inline-flex; align-items:center; gap:7px; }
.chip::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--dim); }
.chip.on { color:var(--ink); border-color:rgba(63,230,216,.6); background:rgba(15,109,115,.35); }
.chip.on::before { background:var(--teal); box-shadow:0 0 6px var(--teal); }
.chip.warn:not(.on) { color:var(--orangehi); border-color:rgba(255,154,31,.55); }
.chip.warn:not(.on)::before { background:var(--orange); }
.chip:hover { border-color:var(--teal); }

/* ---------- panes ---------- */
main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(300px,34%) minmax(0,1fr); gap:10px; padding:8px 18px 16px 30px; }
main.nochat { grid-template-columns:minmax(0,1fr); }
main.noright { grid-template-columns:minmax(0,1fr); }
.right { display:grid; grid-template-rows:minmax(0,64fr) minmax(90px,36fr); gap:10px; min-height:0; }
.right.onlyboard { grid-template-rows:minmax(0,1fr); }
.right.onlylog { grid-template-rows:minmax(0,1fr); }
.panel { position:relative; background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; min-height:0; min-width:0; }
.panel::before, .panel::after { content:""; position:absolute; width:12px; height:12px; border:2px solid var(--teal); pointer-events:none; opacity:.8; }
.panel::before { top:-1px; left:-1px; border-right:0; border-bottom:0; }
.panel::after { bottom:-1px; right:-1px; border-left:0; border-top:0; }
.panel > h2 { margin:0; padding:7px 12px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); font-weight:400; }
.panel > h2 .micro { color:var(--orange); }
.panel > h2 .title { font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink); }
.panel > h2 .grow { flex:1; }
.scroll { overflow:auto; flex:1; min-height:0; }
.empty { color:var(--muted); padding:14px; }
.dimtext { color:var(--dim); }
.mutedtext { color:var(--muted); }

/* ---------- scoreboard ---------- */
.teamstats { padding:6px 10px 2px; display:grid; gap:4px; }
.bar { position:relative; height:18px; background:rgba(255,79,109,.32); overflow:hidden; }
.bar > i { position:absolute; inset:0 auto 0 0; background:rgba(63,230,216,.45); }
.bar > span { position:absolute; inset:0; text-align:center; font-size:12px; line-height:18px; color:var(--ink); text-shadow:0 0 3px #000; }
.bar.marked { background:rgba(255,63,216,.45); }
.bar.marked > i { background:rgba(107,106,101,.95); }
table { width:100%; border-collapse:collapse; }
th { position:sticky; top:0; z-index:1; background:#08303a; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
  text-align:left; padding:5px 8px; font-weight:400; cursor:pointer; user-select:none; white-space:nowrap; }
th.num, td.num { text-align:right; }
th:hover { color:var(--ink); }
th.sorted { color:var(--orange); }
th.sorted::after { content:" \25BE"; }
th.sorted.asc::after { content:" \25B4"; }
td { padding:3px 8px; border-bottom:1px solid rgba(111,247,234,.07); white-space:nowrap; }
td.num { font-variant-numeric:tabular-nums; color:var(--muted); font-family:var(--mono); }
td.sid { font-family:var(--mono); color:var(--muted); font-size:12px; }
tr.prow { cursor:pointer; }
tr.prow:hover td { box-shadow:inset 0 0 0 999px rgba(255,255,255,.05); }
tr.prow.sel td { box-shadow:inset 0 0 0 999px rgba(255,154,31,.13); }
tr.prow.connecting td { opacity:.6; }
.pname { display:inline-block; max-width:260px; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom; }
.pname.you { color:var(--green); }
.nick { color:var(--red); margin-left:6px; font-size:12px; }
.pill { display:inline-block; font-size:11px; line-height:16px; padding:0 7px; margin:0 0 0 4px; border-radius:8px; font-weight:700; color:#000; vertical-align:1px; }
.icons { float:right; display:inline-flex; gap:5px; margin-left:8px; }
.ico { font:700 10px var(--mono); padding:0 4px; border:1px solid; border-radius:2px; line-height:14px; }
.ico.vac { color:#fff; border-color:#999; background:#444; }
.ico.game { color:#ffd39b; border-color:#c8803a; }
.ico.sb { color:#ffe08a; border-color:#a88a2a; }
.ico.heart { color:#ff5a6e; border:0; font-size:13px; }

/* ---------- chat / log ---------- */
.line { padding:1px 10px; white-space:pre-wrap; word-break:break-word; }
.line .pre { color:#808080; margin-right:5px; }
.line .who { cursor:pointer; }
.line .who:hover { text-decoration:underline; }
.line.kill { color:#7f8080; }
.line .msg { color:#cccccc; }
.logline { padding:1px 10px; white-space:pre-wrap; word-break:break-word; font-size:13px; }
.logline .ts { color:rgba(64,255,64,.35); margin-right:7px; font-family:var(--mono); font-size:12px; }

/* ---------- drawer (player dossier) ---------- */
#drawer { position:fixed; top:62px; right:0; bottom:0; width:min(460px, 100%); z-index:30; transform:translateX(105%); transition:transform .16s ease-out;
  background:rgba(3,22,27,.98); border-left:1px solid var(--linehot); display:flex; flex-direction:column; box-shadow:-18px 0 40px rgba(0,0,0,.5); }
#drawer.open { transform:none; }
#drawer .head { display:flex; gap:12px; padding:12px; border-bottom:1px solid var(--line); }
#drawer .avatar { width:96px; height:96px; flex:none; background:var(--well); border:1px solid var(--line); object-fit:cover; }
#drawer .who { min-width:0; flex:1; }
#drawer .who .n { font-size:18px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#drawer .ids { font:12px var(--mono); color:var(--muted); word-break:break-all; }
#drawer .badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.badge { font-size:11px; letter-spacing:.12em; padding:1px 7px; border:1px solid var(--line); color:var(--muted); text-transform:uppercase; }
.badge.ok { color:var(--green); border-color:rgba(141,255,106,.45); }
.badge.hot { color:var(--orange); border-color:rgba(255,154,31,.55); }
.badge.bad { color:var(--red); border-color:rgba(255,79,109,.55); }
#drawer .body { overflow:auto; flex:1; padding:4px 14px 18px; }
.sec { margin-top:14px; }
.sec > .micro { margin-bottom:6px; }
.kv { display:grid; grid-template-columns:128px 1fr; gap:2px 10px; font-size:13px; }
.kv > div:nth-child(odd) { color:var(--muted); text-align:right; }
.v-red { color:var(--red); } .v-yellow { color:#ffe35c; } .v-green { color:var(--green); } .v-dim { color:var(--dim); }
.listmark { border-left:2px solid var(--line); padding:3px 0 5px 9px; margin:5px 0; }
.listmark.own { border-left-color:var(--teal); }
.listmark .ln { color:var(--muted); font-size:12px; }
.listmark .proof { color:#6ff; font-size:12px; white-space:pre-wrap; word-break:break-word; }
.marks-grid { display:grid; grid-template-columns:1fr 1fr; gap:3px 10px; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:2px; vertical-align:0; }
.row { display:flex; gap:8px; align-items:center; margin-top:7px; flex-wrap:wrap; }
.friends td { font-size:12px; }

/* ---------- inputs: text, checkbox, range, color ---------- */
input[type=text], input[type=password], input[type=number], textarea { width:100%; background:var(--well); border:1px solid var(--line); border-radius:0; padding:5px 8px; outline:none; }
input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, textarea:focus { border-color:var(--teal); box-shadow:0 0 0 1px rgba(63,230,216,.25); }
input::placeholder { color:var(--dim); }
input[type=number] { width:96px; font-family:var(--mono); }
.chk { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
.chk input { appearance:none; -webkit-appearance:none; margin:0; flex:none; width:16px; height:16px; border:1px solid var(--linehot); background:var(--well);
  display:grid; place-content:center; cursor:pointer; transition:background .08s; }
.chk input::before { content:""; width:9px; height:9px; transform:scale(0); transition:transform .08s; background:var(--orange);
  clip-path:polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
.chk input:checked { border-color:var(--orange); background:rgba(255,154,31,.15); }
.chk input:checked::before { transform:scale(1); }
.chk input:focus-visible { outline:1px solid var(--teal); outline-offset:2px; }
.chk input:disabled { opacity:.4; cursor:default; }
.chk:hover input:not(:disabled) { border-color:var(--teal); }
input[type=range] { -webkit-appearance:none; appearance:none; width:180px; height:18px; background:transparent; cursor:pointer; }
input[type=range]::-webkit-slider-runnable-track { height:4px; background:linear-gradient(90deg, var(--tealdeep), var(--teal)); }
input[type=range]::-moz-range-track { height:4px; background:linear-gradient(90deg, var(--tealdeep), var(--teal)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:16px; margin-top:-6px; background:var(--orange); border:1px solid #2a1200; transform:skewX(-12deg); }
input[type=range]::-moz-range-thumb { width:12px; height:16px; background:var(--orange); border:1px solid #2a1200; border-radius:0; }
input[type=color] { -webkit-appearance:none; appearance:none; width:42px; height:24px; padding:2px; border:1px solid var(--linehot); background:var(--well); cursor:pointer; }
input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
input[type=color]::-webkit-color-swatch { border:0; }
input[type=color]::-moz-color-swatch { border:0; }

/* ---------- themed select (custom dropdown) ---------- */
.tsel { position:relative; display:inline-block; min-width:170px; }
.tsel > button { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--well); border:1px solid var(--line);
  padding:5px 9px; cursor:pointer; text-align:left; }
.tsel > button::after { content:""; width:7px; height:7px; border-right:2px solid var(--teal); border-bottom:2px solid var(--teal); transform:rotate(45deg) translateY(-2px); flex:none; }
.tsel > button:hover, .tsel.open > button { border-color:var(--teal); }
.tsel > button span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tsel:has(button:disabled) { opacity:.45; }
.dropdown { position:fixed; z-index:90; min-width:170px; max-height:320px; overflow:auto; background:#05222a; border:1px solid var(--linehot);
  box-shadow:0 12px 30px rgba(0,0,0,.55); padding:3px 0; }
.dropdown .opt { padding:5px 12px; cursor:pointer; white-space:nowrap; }
.dropdown .opt:hover, .dropdown .opt.hl { background:rgba(63,230,216,.14); }
.dropdown .opt.cur { color:var(--orange); }

/* ---------- menus (header menus + context menu) ---------- */
.menu { position:fixed; z-index:80; min-width:210px; background:#05222a; border:1px solid var(--linehot); box-shadow:0 12px 30px rgba(0,0,0,.55); padding:4px 0; }
.menu .mi { display:flex; align-items:center; gap:10px; padding:5px 14px 5px 12px; cursor:pointer; white-space:nowrap; position:relative; }
.menu .mi:hover { background:rgba(63,230,216,.14); }
.menu .mi.dis { color:var(--dim); cursor:default; background:none; }
.menu .mi .ck { width:12px; color:var(--orange); }
.menu .mi.sub::after { content:"\25B8"; margin-left:auto; color:var(--muted); }
.menu .sep { height:1px; background:var(--line); margin:4px 0; }
.menu .hdr { padding:3px 14px; font-size:12px; color:var(--muted); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- modals ---------- */
.modal-back { position:fixed; inset:0; z-index:50; background:rgba(0,8,10,.62); display:flex; align-items:center; justify-content:center; padding:20px; }
.modal { position:relative; background:rgba(3,24,29,.99); border:1px solid var(--linehot); width:min(760px, 100%); max-height:100%; display:flex; flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.6); }
.modal.wide { width:min(1120px, 100%); height:min(760px, 100%); }
.modal.small { width:min(460px, 100%); }
.modal > h3 { margin:0; padding:11px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); font-weight:400; letter-spacing:.14em; text-transform:uppercase; }
.modal > h3 .grow { flex:1; }
.modal > h3 .x { background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; }
.modal > h3 .x:hover { color:var(--ink); }
.modal > .mbody { padding:14px 16px; overflow:auto; min-height:0; flex:1; }
.modal > .mfoot { padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
.progress { height:16px; background:var(--well); border:1px solid var(--line); position:relative; overflow:hidden; }
.progress > i { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, var(--tealdeep), var(--teal)); }
.progress > span { position:absolute; inset:0; text-align:center; font-size:11px; line-height:14px; }
ul.files { margin:4px 0 10px; padding-left:20px; font-family:var(--mono); font-size:12px; }

/* settings */
.settings { display:grid; grid-template-columns:200px 1fr; height:100%; min-height:0; }
.settings nav { border-right:1px solid var(--line); overflow:auto; padding:6px 0; }
.settings nav button { display:block; width:100%; text-align:left; background:none; border:0; padding:7px 14px; cursor:pointer; color:var(--muted); letter-spacing:.04em; }
.settings nav button:hover { color:var(--ink); background:rgba(63,230,216,.06); }
.settings nav button.cur { color:var(--ink); background:rgba(255,154,31,.1); box-shadow:inset 3px 0 0 var(--orange); }
.settings .items { overflow:auto; padding:6px 18px 18px; }
.setting { padding:10px 0; border-bottom:1px solid rgba(111,247,234,.08); }
.setting .lbl { display:block; margin-bottom:5px; }
.setting .help { color:var(--dim); font-size:12px; margin-top:4px; }
.setting .ctl { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.setting .ctl input[type=text], .setting .ctl input[type=password] { max-width:440px; }
.setting.err input { border-color:var(--red); }
.note { color:var(--dim); font-size:12px; margin-top:10px; }

/* lists */
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding-bottom:10px; }
.toolbar input[type=text] { width:240px; }
.lists-body { display:flex; flex-direction:column; height:100%; min-height:0; }
.lists-body .scroll { border:1px solid var(--line); }

/* tooltip + toast */
#tip { position:fixed; z-index:95; pointer-events:none; background:#05222a; border:1px solid var(--linehot); padding:7px 10px; font-size:12px; max-width:320px; display:none;
  box-shadow:0 8px 22px rgba(0,0,0,.5); }
#toasts { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:6px; align-items:center; }
.toast { background:#05222a; border:1px solid var(--linehot); padding:7px 14px; box-shadow:0 8px 22px rgba(0,0,0,.5); }
.toast.bad { border-color:var(--red); color:#ffd6de; }

@media (max-width:980px) {
  main { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(200px,40%) minmax(0,1fr); }
  .strip { gap:12px; }
  .counter span { font-size:16px; }
  .screen, nav.menus button span.long { display:none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 9v14l-13 7L3 23V9z" fill="none" stroke="#3fe6d8" stroke-width="2"/><path d="M10 12h12M16 12v11" stroke="#ff9a1f" stroke-width="3"/></svg>
    <span class="word">TF2<b>PL</b></span>
  </div>
  <div class="screen"><small>SCREEN</small><span id="screen">SCOREBOARD</span></div>
  <nav class="menus">
    <button data-menu="file">FILE</button>
    <button data-menu="view">VIEW</button>
    <button data-menu="help">HELP</button>
  </nav>
  <div class="grow"></div>
  <span class="status" id="status">connecting</span>
  <button class="btn primary" id="open-settings">Settings</button>
</header>

<div class="banner preview" id="b-preview" hidden>
  <b>PREVIEW MODE</b><span class="grow">Sample lobby - game actions are off and sample marks aren't saved.</span>
  <button class="btn primary small" data-act="exit-preview">Exit preview</button>
</div>
<div class="banner update" id="b-update" hidden></div>
<div class="banner warn" id="b-moved" hidden></div>

<section class="strip">
  <span class="micro">Information ///</span>
  <span class="where grow" id="where"></span>
  <div class="parse" id="parse" hidden><div class="progress"><i></i><span></span></div></div>
  <div class="counter"><small>Players</small><span id="c-players">00</span></div>
  <div class="counter" id="c-marked-wrap"><small>Marked</small><span id="c-marked">00</span></div>
  <div class="counter" id="c-rules-wrap" title=""><small>Rules</small><span id="c-rules">000</span></div>
</section>
<section class="chips" id="chips"></section>

<main id="main">
  <section class="panel" id="p-chat"><h2><span class="micro">Comms</span><span class="title">Chat</span></h2><div class="scroll" id="chat"></div></section>
  <div class="right" id="p-right">
    <section class="panel" id="p-board"><h2><span class="micro">Roster</span><span class="title">Scoreboard</span><span class="grow"></span><span class="badge hot" id="vote" hidden>Vote in progress</span></h2>
      <div class="teamstats" id="teamstats"></div>
      <div class="scroll"><table id="board"></table><div class="empty" id="board-empty" hidden>No players yet.</div></div>
    </section>
    <section class="panel" id="p-log"><h2><span class="micro">System</span><span class="title">App log</span></h2><div class="scroll" id="log"></div></section>
  </div>
</main>

<aside id="drawer" aria-label="Player">
  <div class="head">
    <img class="avatar" id="d-avatar" alt="">
    <div class="who">
      <div class="n" id="d-name"></div>
      <div class="ids" id="d-ids"></div>
      <div class="badges" id="d-badges"></div>
    </div>
    <button class="btn ghost small" id="d-close" title="Close (Esc)">Close</button>
  </div>
  <div class="body" id="d-body"></div>
</aside>

<div id="tip"></div>
<div id="toasts"></div>

<script>
"use strict";
const TOKEN = "__TF2PL_TOKEN__";

// ----------------------------------------------------------------------------------------------- state
const S = { state: null, chat: null, log: null, settings: null, dossier: null, lists: null };
const ui = {
  selected: null,          // focused player id ("self" for you in streamer mode)
  sort: { col: "kills", asc: false },
  conn: "connecting",      // live | poll | off
  es: null, pollTimer: null, lastOk: 0,
  modal: null,             // { kind, el, ... }
  menu: null, dropdown: null,
  reason: "",
  settingsSection: null, settingsSig: "", settingsFilter: "",
  lists: { search: "", list: "", mark: "", onlyWritable: false, offset: 0 },
  exportOpen: false, aboutOpen: false, confirm: null,
  untrustedHidden: false,
};
try { const s = JSON.parse(localStorage.getItem("tf2pl.sort") || "null"); if (s && s.col) ui.sort = s; } catch (e) {}

const $ = (id) => document.getElementById(id);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k === "on") for (const ev in v) e.addEventListener(ev, v[ev]);
    else if (k === "value") e.value = v;
    else if (k === "checked" || k === "disabled" || k === "hidden") e[k] = !!v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const pad = (n, w) => String(Math.max(0, n | 0)).padStart(w, "0");
function fmtTime(s) { s = Math.max(0, s | 0); const m = (s / 60) | 0; return m + ":" + String(s % 60).padStart(2, "0"); }
function fmtDays(d) {
  if (d == null) return "";
  if (d < 1) return "less than a day";
  const y = Math.floor(d / 365), rest = d % 365, mo = Math.floor(rest / 30);
  if (y > 0) return y + (y === 1 ? " year" : " years") + (mo ? ", " + mo + (mo === 1 ? " month" : " months") : "");
  if (mo > 0) return mo + (mo === 1 ? " month" : " months") + ", " + (rest % 30) + " days";
  return d + (d === 1 ? " day" : " days");
}
function toast(text, bad) {
  const t = h("div", { class: "toast" + (bad ? " bad" : ""), text });
  $("toasts").append(t);
  setTimeout(() => t.remove(), bad ? 5000 : 2600);
}
async function copy(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      // Custom HTTP hostnames don't get localhost's secure-context exception.
      // Keep Copy working from the user's click without requiring a certificate.
      const previousFocus = document.activeElement;
      const field = document.createElement("textarea");
      field.value = text;
      field.readOnly = true;
      field.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
      document.body.appendChild(field);
      try {
        field.focus();
        field.select();
        if (!document.execCommand("copy")) throw new Error("Copy failed");
      } finally {
        field.remove();
        if (previousFocus && previousFocus.focus) previousFocus.focus({ preventScroll: true });
      }
    }
    toast("Copied " + text);
  } catch (_) {
    toast("Couldn't copy to the clipboard", true);
  }
}

// ----------------------------------------------------------------------------------------------- connection
async function post(action) {
  try {
    const r = await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json", "X-TF2PL-Token": TOKEN }, body: JSON.stringify(action) });
    if (r.status === 401) { setConn("off", "reload this page"); return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    if (ui.conn !== "live") setTimeout(pollOnce, 120);
  } catch (e) { toast("TF2PL didn't take that action (" + e.message + ")", true); }
}
function setConn(kind, text) {
  ui.conn = kind;
  const s = $("status");
  s.className = "status " + (kind === "live" ? "live" : kind === "poll" ? "poll" : kind === "off" ? "off" : "");
  s.textContent = text || (kind === "live" ? "live" : kind === "poll" ? "polling" : kind === "off" ? "offline" : "connecting");
}
function accept(channel, data) {
  // a lookup from Player Lists opens whatever dossier comes back
  if (channel === "dossier" && ui.pendingLookup && data && data.id) { ui.pendingLookup = false; ui.selected = data.id; }
  S[channel] = data;
  ui.lastOk = Date.now();
  if (channel === "state") renderState();
  else if (channel === "chat") renderChat();
  else if (channel === "log") renderLog();
  else if (channel === "settings") { if (ui.modal && ui.modal.kind === "settings") renderSettings(); }
  else if (channel === "dossier") renderDossier();
  else if (channel === "lists") { if (ui.modal && ui.modal.kind === "lists") renderLists(); }
}
async function pollOnce() {
  try {
    const r = await fetch("/api/state", { headers: { "X-TF2PL-Token": TOKEN }, cache: "no-store" });
    if (r.status === 401) { setConn("off", "reload this page"); return false; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const all = await r.json();
    for (const k of ["state", "chat", "log", "settings", "dossier", "lists"]) if (k in all) accept(k, all[k]);
    if (ui.conn !== "live") setConn("poll");
    return true;
  } catch (e) {
    if (Date.now() - ui.lastOk > 4000) { setConn("off", "TF2PL not responding"); showMoved(); }
    return false;
  }
}
function startPolling() {
  if (ui.pollTimer) return;
  ui.pollTimer = setInterval(pollOnce, 1000);
}
function stopPolling() { if (ui.pollTimer) { clearInterval(ui.pollTimer); ui.pollTimer = null; } }
function connect() {
  if (!window.EventSource) { startPolling(); return; }
  const es = new EventSource("/api/events?token=" + encodeURIComponent(TOKEN));
  ui.es = es;
  for (const ch of ["state", "chat", "log", "settings", "dossier", "lists"])
    es.addEventListener(ch, (e) => { try { accept(ch, JSON.parse(e.data)); } catch (err) {} });
  es.onopen = () => { setConn("live"); stopPolling(); $("b-moved").hidden = true; };
  es.onerror = () => {
    es.close(); ui.es = null;
    if (ui.conn === "live") setConn("poll");
    startPolling();
    setTimeout(connect, 5000);
  };
}
function showMoved() {
  const st = S.state;
  const b = $("b-moved");
  if (st && st.webPort && String(st.webPort) !== location.port) {
    b.replaceChildren(h("b", { text: "MOVED" }), h("span", { class: "grow", text: "The web UI now listens on port " + st.webPort + "." }),
      h("a", { class: "btn small", href: "http://127.0.0.1:" + st.webPort + "/", text: "Open it" }));
    b.hidden = false;
  }
}

// ----------------------------------------------------------------------------------------------- lookups
function attrInfo(id) {
  const st = S.state;
  if (st) for (const a of st.attributes) if (a.id === id) return a;
  const tagColor = st && st.tagColors && st.tagColors[id];
  return { id, name: id.startsWith("custom:") ? id.slice(7) : id, color: tagColor || "#b8c7c4" };
}
function textOn(hex) {
  const n = parseInt((hex || "#cccccc").slice(1), 16);
  const lum = ((n >> 16) & 255) * .299 + ((n >> 8) & 255) * .587 + (n & 255) * .114;
  return lum > 140 ? "#000" : "#fff";
}
function pill(id) {
  const a = attrInfo(id);
  return h("span", { class: "pill", text: a.name, style: { background: a.color, color: textOn(a.color) } });
}
function combinedMarks(p) {
  const seen = [];
  for (const m of p.marks || []) for (const a of m.attrs) if (!seen.includes(a)) seen.push(a);
  // built-in marks first, in their usual order, then tags
  const order = (S.state ? S.state.attributes.map((a) => a.id) : []);
  return seen.sort((a, b) => (order.indexOf(a) < 0 ? 999 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 999 : order.indexOf(b)));
}
function findPlayer(id) { return S.state && id ? S.state.players.find((p) => p.id === id) : null; }
function siteURL(tpl, id64, id3) { return tpl.split("%SteamID64%").join(id64).split("%SteamID3%").join(id3); }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }

// ----------------------------------------------------------------------------------------------- header, strip, chips
const CHIPS = [
  { name: "pause", label: "Pause", get: (s) => s.paused, warn: false, tip: "Stops reading the console and sending commands until unpaused." },
  { name: "chat_warnings", label: "Chat warnings", get: (s) => s.toggles.chatWarnings, warn: true, tip: "Enables chat message warnings about cheaters." },
  { name: "party_warnings", label: "Party warnings", get: (s) => s.toggles.partyWarnings, warn: true, tip: "Enables party message warnings about cheaters." },
  { name: "auto_votekick", label: "Auto votekick", get: (s) => s.toggles.autoVotekick, warn: true, tip: "Automatically votekicks cheaters on your team." },
  { name: "auto_mark", label: "Auto-mark", get: (s) => s.toggles.autoMark, warn: true, tip: "Automatically marks players matching the detection rules." },
  { name: "auto_mark_bans", label: "Mark ban records", get: (s) => s.toggles.autoMarkBans, warn: true, tip: "Requires Auto-mark. Marks VAC/game ban history and SourceBans." },
  { name: "show_commands", label: "Show commands", get: (s) => s.showCommands, warn: false, tip: "Prints out all game commands to the log." },
  { name: "streamer", label: "Streamer mode", get: (s) => s.streamer.enabled, warn: false, tip: "Shows your custom streamer profile instead of your own name, avatar and SteamID. Set it up in Settings > Streamer mode." },
  { name: "preview", label: "Preview", get: (s) => s.preview.requested, warn: false, tip: "Shows a sample lobby so you can explore TF2PL without TF2. Nothing is sent to the game." },
];
function renderChips(st) {
  const box = $("chips");
  if (box.childElementCount !== CHIPS.length) {
    box.replaceChildren(...CHIPS.map((c) => h("button", { class: "chip", "data-chip": c.name, title: c.tip, text: c.label,
      on: { click: () => { const now = c.get(S.state); post({ type: "toggle", name: c.name, value: !now }); } } })));
  }
  CHIPS.forEach((c, i) => {
    const on = !!c.get(st);
    const el = box.children[i];
    el.className = "chip" + (on ? " on" : "") + (c.warn ? " warn" : "");
    el.title = c.tip + (c.warn && !on ? "\n\nThis is orange because it is currently disabled." : "");
  });
}
function renderState() {
  const st = S.state;
  if (!st) return;
  const screen = $("screen");
  screen.textContent = st.preview.active ? "PREVIEW" : "SCOREBOARD";
  screen.className = st.preview.active ? "preview" : "";
  $("b-preview").hidden = !st.preview.active;

  const up = $("b-update");
  if (st.update && st.update.status === "UpdateAvailable" && st.update.available && st.update.available.url) {
    up.replaceChildren(h("b", { text: "UPDATE" }), h("span", { class: "grow", text: "TF2PL " + st.update.available.version + " is available." }),
      h("a", { class: "btn small primary", href: st.update.available.url, target: "_blank", rel: "noopener noreferrer", text: "Release page" }));
    up.hidden = false;
  } else up.hidden = true;

  // where we are
  const where = $("where");
  if (st.server.name) {
    where.replaceChildren(h("span", { text: st.server.name }),
      st.server.map ? h("span", { class: "sep", text: "//" }) : null, st.server.map ? h("span", { class: "map", text: st.server.map }) : null);
  } else where.replaceChildren(h("span", { class: "off", text: "Not connected" }));
  const parse = $("parse");
  parse.hidden = !(st.parseProgress < 0.95);
  if (!parse.hidden) { parse.querySelector("i").style.width = (st.parseProgress * 100) + "%"; parse.querySelector("span").textContent = "parsing " + Math.round(st.parseProgress * 100) + "%"; }
  $("c-players").textContent = pad(st.players.length, 2);
  $("c-marked").textContent = pad(st.markedCount, 2);
  $("c-marked-wrap").className = "counter" + (st.markedCount > 0 ? " hot" : "");
  $("c-rules").textContent = pad(st.rules, 3);
  $("c-rules-wrap").title = st.rules + " rules loaded, " + st.blacklistedPlayers + " blacklisted players across all player lists";
  $("vote").hidden = !st.voteInProgress;
  renderChips(st);

  // panes (View menu / Settings > Interface)
  const v = st.view;
  $("p-chat").hidden = !v.chat;
  $("p-board").hidden = !v.scoreboard;
  $("p-log").hidden = !v.appLog;
  $("p-right").hidden = !v.scoreboard && !v.appLog;
  $("p-right").className = "right" + (v.scoreboard && !v.appLog ? " onlyboard" : !v.scoreboard && v.appLog ? " onlylog" : "");
  $("main").className = !v.chat ? "nochat" : (!v.scoreboard && !v.appLog ? "noright" : "");

  renderBoard();
  renderTeamStats();
  if (ui.selected && !S.dossier) renderDossierQuick();
  if (st.untrusted && !ui.untrustedHidden && !(ui.modal && ui.modal.kind === "untrusted")) openUntrusted();
  if (!st.untrusted && ui.modal && ui.modal.kind === "untrusted") closeModal();
  if (ui.modal && ui.modal.kind === "export") renderExport();
  if (ui.modal && ui.modal.kind === "about") { /* static */ }
  if (ui.menu && ui.menu.kind === "header") ui.menu.refresh && ui.menu.refresh();
}

// ----------------------------------------------------------------------------------------------- scoreboard
const COLS = [
  { key: "userid", label: "ID", num: true, val: (p) => p.userid == null ? -1 : p.userid },
  { key: "name", label: "Name", val: (p) => (p.name || "").toLowerCase() },
  { key: "kills", label: "Kills", num: true, val: (p) => p.kills },
  { key: "deaths", label: "Deaths", num: true, val: (p) => p.deaths },
  { key: "connected", label: "Time", num: true, val: (p) => p.connected },
  { key: "ping", label: "Ping", num: true, val: (p) => p.ping },
  { key: "steamid3", label: "Steam ID", val: (p) => p.steamid3 },
];
function rowBackground(p, st) {
  if (p.teamShare === "same") return rgba(st.colors.friendlyBG, Math.min(st.colors.friendlyBGAlpha + .08, 1));
  if (p.teamShare === "opposite") return rgba(st.colors.enemyBG, Math.min(st.colors.enemyBGAlpha + .08, 1));
  if (p.team === "red") return "rgba(255,128,128,.16)";
  if (p.team === "blue") return "rgba(128,128,255,.16)";
  return "";
}
function renderBoard() {
  const st = S.state;
  const t = $("board");
  const col = COLS.find((c) => c.key === ui.sort.col) || COLS[2];
  const players = [...st.players].sort((a, b) => {
    const x = col.val(a), y = col.val(b);
    const d = x < y ? -1 : x > y ? 1 : 0;
    return ui.sort.asc ? d : -d;
  });
  const head = h("tr", null, COLS.map((c) => h("th", {
    class: (c.num ? "num " : "") + (c.key === ui.sort.col ? "sorted" + (ui.sort.asc ? " asc" : "") : ""), text: c.label,
    on: { click: () => { ui.sort = { col: c.key, asc: c.key === ui.sort.col ? !ui.sort.asc : !c.num }; try { localStorage.setItem("tf2pl.sort", JSON.stringify(ui.sort)); } catch (e) {} renderBoard(); } }
  })));
  const rows = players.map((p) => {
    const nameCell = h("td");
    const active = p.state === "active" && p.name;
    const nm = h("span", { class: "pname" + (p.isLocal ? " you" : ""), text: p.name || "<Unknown>" });
    if (p.isLocal) nm.style.color = st.colors.you;
    if (!active) nm.style.color = st.colors.connecting;
    nameCell.append(nm);
    for (const a of combinedMarks(p)) nameCell.append(pill(a));
    const icons = h("span", { class: "icons" });
    if (p.vac > 0) icons.append(h("span", { class: "ico vac", text: "VAC", title: "VAC Banned" }));
    if (p.gameBans > 0) icons.append(h("span", { class: "ico game", text: "GB", title: "Game Banned" }));
    if (p.friend) icons.append(h("span", { class: "ico heart", text: "\u2665", title: "Steam Friends" }));
    if (p.sourceBans > 0) icons.append(h("span", { class: "ico sb", text: "SB", title: "Has SourceBans Entries" }));
    if (icons.childElementCount) nameCell.prepend(icons);
    const unknown = !p.name;
    const tr = h("tr", { class: "prow" + (p.id === ui.selected ? " sel" : "") + (active ? "" : " connecting") },
      h("td", { class: "num", text: p.userid == null ? "?" : p.userid }),
      nameCell,
      h("td", { class: "num", text: unknown ? "?" : p.kills }),
      h("td", { class: "num", text: unknown ? "?" : p.deaths }),
      h("td", { class: "num", text: unknown ? "?" : fmtTime(p.connected) }),
      h("td", { class: "num", text: unknown ? "?" : p.ping }),
      h("td", { class: "sid", text: p.steamid3 }));
    const bg = rowBackground(p, st);
    if (bg) tr.style.background = bg;
    tr.addEventListener("click", () => selectPlayer(p.id));
    tr.addEventListener("contextmenu", (e) => { e.preventDefault(); openPlayerMenu(e.clientX, e.clientY, p.id); });
    tr.addEventListener("mousemove", (e) => showTip(e, p));
    tr.addEventListener("mouseleave", hideTip);
    return tr;
  });
  t.replaceChildren(head, ...rows);
  $("board-empty").hidden = players.length > 0;
}
function renderTeamStats() {
  const st = S.state;
  const box = $("teamstats");
  if (!st.view.teamStats) { box.replaceChildren(); box.hidden = true; return; }
  box.hidden = false;
  const team = [{ n: 0, k: 0, m: 0, a: 0, ma: 0 }, { n: 0, k: 0, m: 0, a: 0, ma: 0 }];
  for (const p of st.players) {
    const i = p.teamShare === "same" ? 0 : p.teamShare === "opposite" ? 1 : -1;
    if (i < 0) continue;
    const marked = (p.marks || []).length > 0, active = p.state === "active";
    team[i].n++; team[i].k += p.kills; if (marked) team[i].m++; if (active) team[i].a++; if (marked && active) team[i].ma++;
  }
  const bar = (frac, text, cls) => h("div", { class: "bar" + (cls ? " " + cls : "") }, h("i", { style: { width: (frac * 100) + "%" } }), h("span", { text }));
  const bars = [];
  const total = team[0].n + team[1].n;
  if (total > 0) bars.push(bar(team[0].n / total, "Team Players: " + team[0].n + " | " + team[1].n));
  const kills = team[0].k + team[1].k;
  if (kills > 0) bars.push(bar(team[0].k / kills, "Team Kills: " + team[0].k + " | " + team[1].k));
  if (total > 0) {
    const marked = team[0].m + team[1].m, unmarked = total - marked;
    bars.push(bar(unmarked / total, "MarkedVS (Total): " + unmarked + " vs " + marked, "marked"));
    if (team[0].m > 0) bars.push(bar((team[0].n - team[0].m) / team[0].n, "MarkedVS (Team): " + (team[0].n - team[0].m) + " vs " + team[0].m, "marked"));
    if (team[1].m > 0) bars.push(bar((team[1].n - team[1].m) / team[1].n, "MarkedVS (Enemy): " + (team[1].n - team[1].m) + " vs " + team[1].m, "marked"));
  }
  box.replaceChildren(...bars);
}
function showTip(e, p) {
  const tip = $("tip");
  const lines = [h("div", { style: { fontWeight: 700 }, text: p.name || p.steamid3 })];
  const marks = combinedMarks(p);
  if (marks.length) lines.push(h("div", null, marks.map(pill)));
  const bits = [];

      h("p", { class: "mutedtext", text: "Their maintainers were found to be malicious: Vorobey's list knowingly accepts fake and manipulated evidence, and ShadeFall is run by an active cheater whose \"anticheat\" produces fabricated evidence used to mark players." }));
    if (r.blacklistedDeleted.length) kids.push(h("div", { text: "These blacklisted lists were deleted:" }), files(r.blacklistedDeleted));
    if (r.blacklistedDisabled.length) kids.push(h("div", { text: "These lists carried blacklisted entries and were disabled (renamed to *.blacklisted-disabled, not deleted):" }), files(r.blacklistedDisabled));
    if (r.blacklistedKept.length) kids.push(h("div", { style: { color: "var(--orange)" }, text: "These lists contain blacklisted entries but were left enabled. Remove those entries, or the marks they add can't be trusted:" }), files(r.blacklistedKept));
  }
  if (r.deleted.length) kids.push(h("div", { text: "TF2PL removed untrusted player lists (Sterling, Shitlist). These lists were found adding incorrect and fake cheater listings, so they are no longer trusted and were deleted:" }), files(r.deleted));
  if (r.contaminated.length) kids.push(h("div", { style: { color: "var(--orange)" }, text: "These lists contain entries from untrusted lists and are unreliable:" }), files(r.contaminated),
    h("div", { class: "mutedtext", text: "Players marked by these lists may not be cheaters. Double-check before acting on them, or remove the lists." }));
  if (r.exports.length) kids.push(h("div", { style: { color: "var(--orange)" }, text: "These exports were combined from all your lists while an untrusted list was installed and may include its entries:" }), files(r.exports),
    h("div", { class: "mutedtext", text: "Consider deleting them and running File > Total Export again." }));
  const kept = r.contaminated.length || r.exports.length;
  const foot = h("div", { class: "mfoot" },
    kept ? h("button", { class: "btn ghost", text: "Don't warn about these again", title: "Only applies to untrusted lists. Blacklisted lists are always warned about.",
      on: { click: () => { post({ type: "untrusted_dismiss", acknowledge: true }); ui.untrustedHidden = true; closeModal(); } } }) : null,
    h("button", { class: "btn primary", text: "Understood", on: { click: () => { post({ type: "untrusted_dismiss", acknowledge: false }); ui.untrustedHidden = true; closeModal(); setTimeout(() => { ui.untrustedHidden = false; }, 3000); } } }));
  openModal("untrusted", "Untrusted player list", "", h("div", { class: "mbody" }, ...kids), foot);
}

// ----------------------------------------------------------------------------------------------- misc wiring
document.addEventListener("click", (e) => {
  const act = e.target.closest && e.target.closest("[data-act]");
  if (act && act.dataset.act === "exit-preview") post({ type: "toggle", name: "preview", value: false });
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const confirmBack = [...document.querySelectorAll(".modal-back")].find((b) => b.style.zIndex === "70");
  if (confirmBack) { confirmBack.remove(); return; }
  if (ui.dropdown) { closeDropdown(); return; }
  if (ui.menu) { closeMenu(); return; }
  if (ui.modal && ui.modal.kind !== "untrusted") { closeModal(); return; }
  if ($("drawer").classList.contains("open")) closeDrawer();
});
pollOnce().then(() => connect());
</script>
</body>
